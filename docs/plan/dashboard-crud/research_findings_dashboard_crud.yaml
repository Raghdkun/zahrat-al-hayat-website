      concern: "By design (public data), but worth confirming these should all be publicly readable."
    - area: "Password stored as bcrypt hash with cost 12"
      location: "app/api/teachers/route.ts, app/api/users/route.ts"
      concern: "Good — bcrypt with reasonable cost factor."
    - area: "No CSRF protection on API routes"
      location: "All API routes"
      concern: "Next.js API routes rely on SameSite cookies. JWT strategy mitigates this, but worth noting."
    - area: "No input sanitization on HTML content"
      location: "app/api/blog/route.ts POST/PUT, blog page HtmlEditor"
      concern: "Blog contentAr/contentEn stores raw HTML from contentEditable. No server-side XSS sanitization. Stored XSS risk if content is rendered with dangerouslySetInnerHTML."
    - area: "File upload accepts arbitrary filenames"
      location: "app/api/upload/route.ts"
      concern: "Uses randomUUID for filename (good), but file type validation is based on MIME type which can be spoofed."
  authentication_patterns_in_domain: "NextAuth v5 with JWT strategy. Server-side: auth() returns session. Client-side: useSession() hook."
  authorization_patterns_in_domain: |
    Layout guard: blocks STUDENT from /dashboard/
    API routes individually check role:
    - ADMIN-only: blog (CUD), content (CUD), gallery (CUD), teachers (CUD), users (CRUD), settings (U)
    - ADMIN or TEACHER: appointments (RUD, teacher limited to own)
    - Authenticated: profile (RU, own only), appointments (R, own only for non-ADMIN)
    - Public (no auth): blog (R), content (R), gallery (R), teachers (R), settings (R), upload (POST!)
  data_validation_in_domain: |
    Server-side validation is minimal:
    - Users API: checks required fields, password min 6, valid role enum, email uniqueness
    - Teachers API: checks required name/email/password, email uniqueness
    - Blog API: no field validation beyond id presence
    - Content API: checks key is required
    - Gallery API: no field validation
    - Profile API: validates currentPassword for password change
    Client-side validation:
    - Blog: checks titleAr || titleEn presence
    - Teachers: checks name + email (and password on create)
    - Users: checks name + email, password min 6

