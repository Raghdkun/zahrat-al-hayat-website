plan_id: dashboard-crud
objective: Research ALL dashboard CRUD pages and their corresponding API routes for CRUD testing planning
focus_area: dashboard pages + API routes + auth + prisma schema
created_at: "2026-03-31"
created_by: gem-researcher
status: completed

tldr: |
  - 11 dashboard pages (1 layout, 1 overview, 9 feature pages) + 9 API routes + 1 upload utility route
  - Full CRUD: Blog, Content, Gallery, Teachers, Users; Read+Update+Delete: Appointments; Read+Update: Settings, Profile
  - Auth: NextAuth v5 JWT with credentials; role-based access (ADMIN, TEACHER, STUDENT); layout guards STUDENT out
  - API auth patterns: most routes check role=ADMIN; appointments allows TEACHER for own records; profile is self-only
  - Key bugs found: Gallery page hardcodes Arabic labels (no i18n), Settings page hardcodes Arabic labels, Blog GET has no auth check (public), Upload route has no auth check, Content GET has no auth check

research_metadata:
  methodology: "Full file reads of all 23 files; no search passes needed (explicit file list provided)"
  scope: "Complete dashboard UI layer, all API route handlers, Prisma schema, auth config, sidebar component"
  confidence: high
  coverage: 100

