patterns_found:
  - category: architecture
    pattern: "Client vs Server component split"
    description: "Dashboard overview and payments are server components (async, direct Prisma); all other CRUD pages are 'use client' with fetch() to API routes."
    examples:
      - file: app/[locale]/dashboard/page.tsx
        location: "line 1 (no 'use client')"
        snippet: "export default async function DashboardPage"
      - file: app/[locale]/dashboard/appointments/page.tsx
        location: "line 1"
        snippet: "'use client'"
    prevalence: common

  - category: architecture
    pattern: "API route CRUD pattern"
    description: "Single route.ts with GET/POST/PUT/DELETE exports. ID passed in JSON body for POST/PUT/DELETE (except gallery DELETE uses query param)."
    examples:
      - file: app/api/blog/route.ts
        location: "lines 1-120"
        snippet: "export async function GET/POST/PUT/DELETE"
    prevalence: common

  - category: error_handling
    pattern: "Try-catch with toast notification"
    description: "Client pages wrap fetch calls in try/catch, show toast.error on failure. API routes return JSON error with appropriate HTTP status codes."
    examples:
      - file: app/[locale]/dashboard/blog/page.tsx
        location: "line 217"
        snippet: "catch { toast.error(isRtl ? 'تعذّر حفظ المقال' : \"Couldn't save post\") }"
    prevalence: common

  - category: naming
    pattern: "Bilingual field naming"
    description: "All content fields use Ar/En suffix pairs: titleAr/titleEn, valueAr/valueEn, contentAr/contentEn, bioAr/bioEn."
    examples:
      - file: prisma/schema.prisma
        location: "line 121-122"
        snippet: "valueAr String @default(\"\") / valueEn String @default(\"\")"
    prevalence: common

  - category: structure
    pattern: "Inline form toggle pattern"
    description: "CRUD pages use useState(showForm) boolean to toggle between list view and create/edit form. Same form used for both create and edit (editingId determines mode)."
    examples:
      - file: app/[locale]/dashboard/blog/page.tsx
        location: "line 178"
        snippet: "const [showForm, setShowForm] = useState(false); const [editingId, setEditingId] = useState<string | null>(null);"
    prevalence: common

  - category: architecture
    pattern: "Auth guard hierarchy"
    description: "Layout-level: blocks unauthenticated + STUDENT. Page-level: UsersPage shows 'Unauthorized' for non-ADMIN. API-level: each route independently checks auth+role."
    examples:
      - file: app/[locale]/dashboard/layout.tsx
        location: "line 14-15"
        snippet: "if (!session) redirect; if (role === 'STUDENT') redirect"
      - file: app/[locale]/dashboard/users/page.tsx
        location: "line 120"
        snippet: "if (role !== 'ADMIN') return <Unauthorized />"
    prevalence: common

