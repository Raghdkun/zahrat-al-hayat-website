  framework: "None detected"
  coverage_areas: []
  test_organization: "No test directory or test files found"
  mock_patterns: []

open_questions:
  - question: "Should the Upload route require authentication?"
    context: "Currently anyone can POST files. All other write operations require ADMIN role."
  - question: "Is the blog content sanitized before rendering on the public-facing blog pages?"
    context: "HtmlEditor stores raw HTML via contentEditable. If rendered with dangerouslySetInnerHTML without sanitization, this is a stored XSS vector."
  - question: "Why does Gallery DELETE use query params while all other DELETE routes use JSON body?"
    context: "Inconsistency in API design. Gallery page calls fetch(`/api/gallery?id=${id}`, {method: 'DELETE'}) while others send body."
  - question: "Should TEACHER role see all sidebar links or only relevant ones?"
    context: "DashboardSidebar shows all 10 nav items to everyone. Users page has its own ADMIN guard, but Teachers/Blog/Content/Gallery/Settings pages don't check role client-side."
  - question: "Why are Settings and Gallery pages hardcoded in Arabic?"
    context: "Settings page says 'إعدادات الموقع' and 'الشعار' without locale toggle. Gallery says 'المعرض' and 'رفع ملف'. Other pages properly use isRtl ternary."

gaps:
  - area: "No automated tests"
    description: "Zero test coverage for all dashboard pages and API routes."
    impact: "Cannot verify CRUD operations work correctly without manual testing. No regression safety net."
  - area: "No API input sanitization"
    description: "Blog content (HTML), content block values, and other text fields are not sanitized server-side."
    impact: "Potential XSS vulnerability when rendering user-generated HTML content."
  - area: "Inconsistent i18n on 2 pages"
    description: "Settings and Gallery pages hardcode Arabic text instead of using isRtl ternary pattern."
    impact: "English-locale users will see Arabic labels on these pages."
  - area: "No pagination on any list"
    description: "All list views fetch ALL records (appointments, blog posts, users, etc.) without pagination."
    impact: "Performance degradation with large datasets."
  - area: "Upload route is unauthenticated"
    description: "POST /api/upload accepts files from anyone."
    impact: "Storage abuse, potential malicious file upload."

