patterns_found:
  - category: architecture
    pattern: "Centralized GSAP animation in page.tsx via data attributes"
    description: "All scroll animations are defined in the parent page via GSAP data-attribute selectors (data-anim-left, data-anim-right, data-anim='stagger-scale', etc). Components just annotate elements. The reusable useGsapFadeUp hook exists but is unused."
    examples:
      - file: page.tsx
        location: "page.tsx:56-90"
        snippet: "document.querySelectorAll('[data-anim-left]').forEach(...)"
      - file: About.tsx
        location: "About.tsx:13"
        snippet: '<div data-anim-left>'
    prevalence: common

  - category: naming
    pattern: "Hardcoded hex colors instead of CSS variable classes"
    description: "Most components use raw hex values (#4e0078, #ab2c5d, #1f1a21, #4d4351, #fbf0fb, etc) despite having equivalent CSS variables defined in globals.css @theme block (brand-primary, brand-secondary, on-surface, on-surface-variant, surface-container-low, etc)."
    examples:
      - file: Hero.tsx
        location: "Hero.tsx:14"
        snippet: 'bg-gradient-to-br from-[#4e0078] to-[#6a1b9a]'
      - file: About.tsx
        location: "About.tsx:9"
        snippet: 'bg-[#fbf0fb]'
      - file: Services.tsx
        location: "Services.tsx:21"
        snippet: 'text-[#ab2c5d]'
      - file: Gallery.tsx
        location: "Gallery.tsx:38"
        snippet: "text-brand-secondary (CORRECT — uses variable)"
    prevalence: common

  - category: structure
    pattern: "Consistent section layout"
    description: "All sections follow: section > max-w-6xl mx-auto > header(label+h2+subtitle) > content grid. Padding: py-16 sm:py-20 px-4 sm:px-6 lg:px-16."
    examples:
      - file: Services.tsx
        location: "Services.tsx:15"
        snippet: '<section className="py-16 sm:py-20 px-4 sm:px-6 lg:px-16">'
    prevalence: common

  - category: error_handling
    pattern: "API fetch with silent failure"
    description: "Teachers and Gallery components fetch data on mount with .catch(() => {}) — errors are silently swallowed."
    examples:
      - file: Teachers.tsx
        location: "Teachers.tsx:30"
        snippet: ".catch(() => setLoading(false))"
      - file: Gallery.tsx
        location: "Gallery.tsx:26"
        snippet: ".catch(() => {})"
    prevalence: occasional

  - category: architecture
    pattern: "No shadcn components on landing page"
    description: "Zero shadcn/ui components (Button, Card, etc.) are used in any of the 10 landing page components. All use custom Tailwind classes. shadcn components exist in components/ui/ but are only used in dashboard pages."
    examples:
      - file: Hero.tsx
        location: "Hero.tsx:36"
        snippet: '<button className="signature-gradient text-white px-7 sm:px-9 py-3...">'
    prevalence: common

  - category: naming
    pattern: "Material Symbols Outlined for all icons"
    description: "All icons use Google Material Symbols Outlined font loaded from CDN in layout.tsx. Delivered as text content in <span class='material-symbols-outlined'>."
    examples:
      - file: About.tsx
        location: "About.tsx:34"
        snippet: '<span className="material-symbols-outlined text-[#4e0078]">auto_awesome</span>'
    prevalence: common

  - category: structure
    pattern: "i18n via next-intl useTranslations with namespaced keys"
    description: "All components use useTranslations('namespace') with dot-notation keys. Namespaces: hero, about, services, founder, gallery, teachers, nav, footer, common."
    examples:
      - file: Hero.tsx
        location: "Hero.tsx:8"
        snippet: "const t = useTranslations('hero');"
    prevalence: common

