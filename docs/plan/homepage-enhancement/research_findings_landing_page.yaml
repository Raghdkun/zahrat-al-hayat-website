    # FILE: components/public/Gallery.tsx (115 lines)
    # ─────────────────────────────────────────────────
    "use client";

    import { useState, useEffect } from "react";
    import { useTranslations, useLocale } from "next-intl";

    interface GalleryItem {
      id: string;
      url: string;
      type: "IMAGE" | "VIDEO";
      titleAr: string;
      titleEn: string;
    }

    export default function Gallery() {
      const t = useTranslations("gallery");
      const locale = useLocale();
      const [items, setItems] = useState<GalleryItem[]>([]);
      const [lightbox, setLightbox] = useState<GalleryItem | null>(null);

      useEffect(() => {
        fetch("/api/gallery")
          .then((r) => r.json())
          .then((data) => {
            if (Array.isArray(data)) {
              setItems(data.filter((i: GalleryItem & { isPublished: boolean }) => i.isPublished));
            }
          })
          .catch(() => {});
      }, []);

      if (items.length === 0) return null;

      const getTitle = (item: GalleryItem) =>
        locale === "ar" ? item.titleAr : item.titleEn;

      return (
        <>
          <section className="py-16 sm:py-20 px-4 sm:px-6 lg:px-16 bg-surface-container-low" id="gallery">
            <div className="max-w-6xl mx-auto">
              <div className="text-center max-w-2xl mx-auto mb-12 sm:mb-16 flex flex-col gap-3" data-anim="fade-up">
                <span className="text-brand-secondary font-bold tracking-widest text-xs uppercase">
                  {t("label")}
                </span>
                <h2 className="editorial-header text-3xl sm:text-4xl font-black text-[#1f1a21]">
                  {t("title")}
                </h2>
                <p className="text-on-surface-variant text-base">{t("subtitle")}</p>
              </div>

              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" data-anim="stagger-up">
                {items.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setLightbox(item)}
                    className="group relative aspect-square rounded-xl overflow-hidden bg-muted cursor-pointer"
                  >
                    {item.type === "VIDEO" ? (
                      <video src={item.url} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" muted playsInline />
                    ) : (
                      <img src={item.url} alt={getTitle(item) || "gallery"} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                    )}
                    {item.type === "VIDEO" && (
                      <div className="absolute inset-0 flex items-center justify-center">
                        <div className="w-12 h-12 rounded-full bg-white/80 flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                          <span className="material-symbols-outlined text-brand-primary text-2xl">play_arrow</span>
                        </div>
                      </div>
                    )}
                    {getTitle(item) && (
                      <div className="absolute inset-x-0 bottom-0 bg-linear-to-t from-black/60 to-transparent p-3">
                        <p className="text-white text-sm font-medium truncate">{getTitle(item)}</p>
                      </div>
                    )}
                  </button>
                ))}
              </div>
            </div>
          </section>

          {/* Lightbox */}
          {lightbox && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4" onClick={() => setLightbox(null)}>
              <button className="absolute top-4 right-4 text-white hover:text-gray-300 transition-colors z-10" onClick={() => setLightbox(null)}>
                <span className="material-symbols-outlined text-4xl">close</span>
              </button>
              <div className="max-w-5xl max-h-[90vh] w-full" onClick={(e) => e.stopPropagation()}>
                {lightbox.type === "VIDEO" ? (
                  <video src={lightbox.url} className="w-full max-h-[85vh] object-contain rounded-lg" controls autoPlay />
                ) : (
                  <img src={lightbox.url} alt={getTitle(lightbox) || "gallery"} className="w-full max-h-[85vh] object-contain rounded-lg" />
                )}
                {getTitle(lightbox) && (
                  <p className="text-white text-center mt-4 text-lg">{getTitle(lightbox)}</p>
                )}
              </div>
            </div>
          )}
        </>
      );
    }

