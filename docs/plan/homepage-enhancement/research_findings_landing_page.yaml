    - Components: PascalCase default exports (Hero, About, Services, etc.)
    - Files: PascalCase for components, kebab-case for hooks
    - CSS classes: kebab-case utilities (signature-gradient, glass-nav, editorial-header)
    - i18n keys: snake_case (cta_primary, self_awareness_title)
    - Data attributes: kebab-case (data-anim-left, data-anim="stagger-scale")
  structure_of_domain: |
    - All public components in components/public/
    - Each component is a single file, default export
    - Page at app/[locale]/page.tsx imports and composes all components
    - No intermediate barrel exports
  error_handling_in_domain: |
    - API fetches use .catch() with silent failures
    - Teachers shows loading skeleton, returns null if no data
    - Gallery returns null if no items
    - No error boundaries
  documentation_in_domain: |
    - No JSDoc or inline comments in components
    - GSAP animations have brief comments in page.tsx (// 1. Hero entrance, // 2. Split reveal, etc.)

