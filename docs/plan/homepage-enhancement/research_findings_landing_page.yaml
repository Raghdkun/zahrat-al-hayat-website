complete_file_contents:
  page_tsx: |
    # FILE: app/[locale]/page.tsx (207 lines)
    # ─────────────────────────────────────
    "use client";

    import { useEffect } from "react";
    import gsap from "gsap";
    import { ScrollTrigger } from "gsap/ScrollTrigger";
    import Navbar from "@/components/public/Navbar";
    import Hero from "@/components/public/Hero";
    import About from "@/components/public/About";
    import Services from "@/components/public/Services";
    import Gallery from "@/components/public/Gallery";
    import Founder from "@/components/public/Founder";
    import Teachers from "@/components/public/Teachers";
    import CTASection from "@/components/public/CTASection";
    import Footer from "@/components/public/Footer";

    gsap.registerPlugin(ScrollTrigger);

    export default function HomePage() {
      useEffect(() => {
        const ctx = gsap.context(() => {
          // 1. Hero entrance animation (no scroll trigger — plays on load)
          const heroTl = gsap.timeline({ delay: 0.3 });
          const heroSection = document.querySelector("#hero-section");
          if (heroSection) {
            heroTl
              .fromTo(
                heroSection.querySelector(".hero-logo"),
                { scale: 0, rotation: -180 },
                { scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.7)" }
              )
              .fromTo(
                heroSection.querySelector("h1"),
                { y: 60, opacity: 0 },
                { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
                "-=0.3"
              )
              .fromTo(
                heroSection.querySelector("h1 span"),
                { y: 40, opacity: 0 },
                { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
                "-=0.4"
              )
              .fromTo(
                heroSection.querySelector("p"),
                { y: 30, opacity: 0 },
                { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" },
                "-=0.3"
              )
              .fromTo(
                heroSection.querySelector(".hero-buttons"),
                { y: 20, opacity: 0 },
                { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
                "-=0.2"
              );
          }

          // 2. Split reveal sections (About / Founder)
          document.querySelectorAll("[data-anim-left]").forEach((el) => {
            gsap.fromTo(
              el,
              { x: -100, opacity: 0 },
              {
                x: 0,
                opacity: 1,
                duration: 1,
                ease: "power3.out",
                scrollTrigger: {
                  trigger: el.closest("section"),
                  start: "top 75%",
                  toggleActions: "play none none none",
                },
              }
            );
          });

          document.querySelectorAll("[data-anim-right]").forEach((el) => {
            gsap.fromTo(
              el,
              { x: 100, opacity: 0 },
              {
                x: 0,
                opacity: 1,
                duration: 1,
                ease: "power3.out",
                scrollTrigger: {
                  trigger: el.closest("section"),
                  start: "top 75%",
                  toggleActions: "play none none none",
                },
              }
            );
          });

          // 3. Stagger scale (Services cards)
          document.querySelectorAll("[data-anim='stagger-scale']").forEach((grid) => {
            gsap.fromTo(
              grid.children,
              { y: 60, opacity: 0, scale: 0.8 },
              {
                y: 0,
                opacity: 1,
                scale: 1,
                duration: 0.6,
                ease: "back.out(1.4)",
                stagger: 0.12,
                scrollTrigger: {
                  trigger: grid,
                  start: "top 80%",
                  toggleActions: "play none none none",
                },
              }
            );
          });

          // 4. Stagger up (Gallery, Teachers)
          document.querySelectorAll("[data-anim='stagger-up']").forEach((grid) => {
            gsap.fromTo(
              grid.children,
              { y: 50, opacity: 0 },
              {
                y: 0,
                opacity: 1,
                duration: 0.5,
                ease: "power2.out",
                stagger: 0.08,
                scrollTrigger: {
                  trigger: grid,
                  start: "top 82%",
                  toggleActions: "play none none none",
                },
              }
            );
          });

          // 5. Zoom in sections (CTA)
          document.querySelectorAll("[data-anim='zoom-in']").forEach((el) => {
            gsap.fromTo(
              el,
              { scale: 0.9, opacity: 0 },
              {
                scale: 1,
                opacity: 1,
                duration: 0.8,
                ease: "power2.out",
                scrollTrigger: {
                  trigger: el,
                  start: "top 80%",
                  toggleActions: "play none none none",
                },
              }
            );
          });

          // 6. Fade up — for section titles / headers
          document.querySelectorAll("[data-anim='fade-up']").forEach((el) => {
            gsap.fromTo(
              el,
              { y: 40, opacity: 0 },
              {
                y: 0,
                opacity: 1,
                duration: 0.8,
                ease: "power3.out",
                scrollTrigger: {
                  trigger: el,
                  start: "top 85%",
                  toggleActions: "play none none none",
                },
              }
            );
          });

          // 7. Parallax effect on decorative elements
          document.querySelectorAll("[data-parallax]").forEach((el) => {
            gsap.to(el, {
              y: -50,
              ease: "none",
              scrollTrigger: {
                trigger: el.closest("section"),
                start: "top bottom",
                end: "bottom top",
                scrub: 1,
              },
            });
          });
        });

        return () => ctx.revert();
      }, []);

      return (
        <>
          <Navbar />
          <main className="pt-20">
            <Hero />
            <About />
            <Services />
            <Gallery />
            <Founder />
            <Teachers />
            <CTASection />
          </main>
          <Footer />
        </>
      );
    }

