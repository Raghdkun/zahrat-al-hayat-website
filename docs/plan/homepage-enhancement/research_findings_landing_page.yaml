open_questions:
  - question: "Why does Gallery.tsx use CSS variable classes (brand-primary, surface-container-low) while all other components use hardcoded hex values?"
    context: "Gallery appears to have been updated/refactored more recently to use the design token system, while other components predate this."
  - question: "Why is the useGsapFadeUp hook and AnimatedSection wrapper never used?"
    context: "They exist in hooks/use-gsap.tsx but all animations are done inline in page.tsx. Possible dead code or intended for future use."
  - question: "Are the Google CDN image URLs in About.tsx and Founder.tsx permanent or should they use /uploads/ or /images/?"
    context: "These appear to be AI-generated placeholder URLs from Google's AIDA service."
  - question: "Should CTASection have its own i18n namespace instead of reusing 'hero'?"
    context: "CTA has 3 hardcoded Arabic strings that don't exist in any i18n file."

gaps:
  - area: "CTASection i18n"
    description: "Three text strings are hardcoded in Arabic: h2 title, p description, and primary button text. No corresponding keys in en.json or ar.json."
    impact: "English visitors see Arabic text in the CTA section. Completely broken i18n."
  - area: "Inconsistent color system"
    description: "Gallery uses CSS variable classes. All other 9 components use hardcoded hex codes. The @theme block in globals.css defines all needed variables but they're not consumed."
    impact: "Theme changes require updating every component individually. Dark mode won't work on landing page. Brand consistency risk."
  - area: "Accessibility"
    description: "No skip-to-content link. Mobile menu button has no aria-label. Gallery lightbox has no ESC key handler, no focus trap, no aria-modal. Social media icon links have no aria-label/screen reader text. Navbar links are anchor tags without proper focus indicators."
    impact: "Fails WCAG 2.1 AA. Poor screen reader experience."
  - area: "Footer hardcoded strings"
    description: "Footer brand description and section headers ('روابط سريعة', 'Quick Links', location) use inline locale conditionals instead of i18n keys."
    impact: "Bypasses translation system. Adding a new locale requires code changes."
  - area: "Mobile menu UX"
    description: "Mobile menu appears/disappears without animation. No scroll lock when open. No focus trap."
    impact: "Jarring user experience on mobile. Content scrolls behind open menu."
  - area: "No dark mode support on landing page"
    description: "Dark CSS variables are defined but no component uses them. All use hardcoded light-mode hex colors."
    impact: "Dark mode toggle (if added) won't affect landing page."

