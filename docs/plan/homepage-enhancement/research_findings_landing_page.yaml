plan_id: homepage-enhancement
objective: "Thoroughly research ALL home page / landing page components and layout"
focus_area: "Landing page components, layout, CSS, i18n, animations"
created_at: "2026-03-31"
created_by: gem-researcher
status: completed

tldr: |
  - Landing page at app/[locale]/page.tsx orchestrates 8 public components (Navbar, Hero, About, Services, Gallery, Founder, Teachers, CTASection, Footer) with GSAP ScrollTrigger animations defined inline.
  - Heavy use of hardcoded hex colors (#4e0078, #ab2c5d, #1f1a21, #4d4351, #fbf0fb, #f6eaf6, #faf5fc, #f0e5f0, #e4b5ff) — brand CSS variables exist in globals.css but are inconsistently applied (Gallery uses them; others don't).
  - CTASection has hardcoded Arabic text instead of using i18n translation keys — a critical i18n bug.
  - No shadcn/ui components are used in any landing page component. All are custom-built with Tailwind utility classes.
  - Accessibility gaps: no skip-to-content link, no aria-labels on icon-only buttons, no focus management for lightbox/mobile-menu, low color contrast in some areas (white text on gradient), missing alt text patterns.
  - Responsive design is present via Tailwind breakpoints (sm/md/lg) but mobile menu lacks animation/transition and has no scroll lock.

research_metadata:
  methodology: "Full file reads of all 15 requested files, plus supporting hook/settings files. Hybrid retrieval: read_file for complete contents, grep_search to validate cross-references."
  scope: "All public-facing landing page components, root layout, CSS, i18n messages, animation hooks"
  confidence: high
  coverage: 100  # All requested files fully read

