  layout_tsx: |
    # FILE: app/[locale]/layout.tsx (76 lines)
    # ───────────────────────────────────────────
    import type { Metadata } from "next";
    import { NextIntlClientProvider } from "next-intl";
    import { getMessages } from "next-intl/server";
    import { Plus_Jakarta_Sans, Manrope, Noto_Kufi_Arabic } from "next/font/google";
    import "@/app/globals.css";

    const plusJakartaSans = Plus_Jakarta_Sans({
      subsets: ["latin"],
      weight: ["400", "500", "700", "800"],
      variable: "--font-headline",
      display: "swap",
    });

    const manrope = Manrope({
      subsets: ["latin"],
      weight: ["400", "500", "600", "700"],
      variable: "--font-body",
      display: "swap",
    });

    const notoKufiArabic = Noto_Kufi_Arabic({
      subsets: ["arabic"],
      weight: ["400", "500", "600", "700"],
      variable: "--font-arabic",
      display: "swap",
    });

    export const metadata: Metadata = {
      title: "Zahrat Al Hayat | مركز زهرة الحياة",
      description: "مركز زهرة الحياة - رحلة نحو التوازن والشفاء الداخلي | Zahrat Al Hayat Center - A Journey Towards Balance and Inner Healing",
    };

    export default async function RootLayout({
      children,
      params,
    }: {
      children: React.ReactNode;
      params: Promise<{ locale: string }>;
    }) {
      const { locale } = await params;
      const messages = await getMessages();

      return (
        <html
          lang={locale}
          dir={locale === "ar" ? "rtl" : "ltr"}
          style={{
            "--font-headline": plusJakartaSans.style.fontFamily,
            "--font-body": manrope.style.fontFamily,
            "--font-arabic": notoKufiArabic.style.fontFamily,
          } as React.CSSProperties}
        >
          <head>
            <link
              rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
            />
          </head>
          <body className={`${plusJakartaSans.variable} ${manrope.variable} ${notoKufiArabic.variable}`}>
            <NextIntlClientProvider messages={messages}>
              {children}
            </NextIntlClientProvider>
          </body>
        </html>
      );
    }

