      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Brand utilities */
    .editorial-header {
      font-family: var(--font-headline), var(--font-arabic), sans-serif;
      letter-spacing: -0.02em;
    }
    .glass-nav {
      background: rgba(234, 223, 234, 0.7);
      backdrop-filter: blur(20px);
    }
    .signature-gradient {
      background: linear-gradient(135deg, #4e0078 0%, #6a1b9a 100%);
    }

    /* Calendar indicators */
    .calendar-has-appointment { position: relative; }
    .calendar-has-appointment::after {
      content: "";
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #ab2c5d;
    }
    .calendar-has-appointment[data-selected="true"]::after {
      background-color: #ffffff;
    }

    @layer base {
      * { @apply border-border outline-ring/50; }
      body {
        @apply bg-background text-foreground;
        font-family: var(--font-body), var(--font-arabic), sans-serif;
        background-color: #fff7fc;
        color: #1f1a21;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      html {
        @apply font-sans;
        scroll-behavior: smooth;
      }
      h1, h2, h3, h4, h5, h6 { letter-spacing: -0.02em; }
      [dir="rtl"] { direction: rtl; text-align: right; }
      [dir="ltr"] { direction: ltr; text-align: left; }
    }

  use_gsap_tsx: |
    # FILE: hooks/use-gsap.tsx (54 lines)
    # ─────────────────────────────────────
    "use client";

    import { useEffect, useRef } from "react";
    import gsap from "gsap";
    import { ScrollTrigger } from "gsap/ScrollTrigger";

    gsap.registerPlugin(ScrollTrigger);

    export function useGsapFadeUp(deps: unknown[] = []) {
      const ref = useRef<HTMLDivElement>(null);

      useEffect(() => {
        if (!ref.current) return;
        const el = ref.current;

        gsap.fromTo(
          el.children,
          { y: 40, opacity: 0 },
          {
            y: 0,
            opacity: 1,
            duration: 0.8,
            ease: "power3.out",
            stagger: 0.12,
            scrollTrigger: {
              trigger: el,
              start: "top 85%",
              toggleActions: "play none none none",
            },
          }
        );

        return () => {
          ScrollTrigger.getAll().forEach((t) => {
            if (t.trigger === el || el.contains(t.trigger as Node)) t.kill();
          });
        };
      }, deps);

      return ref;
    }

    export function AnimatedSection({
      children,
      className = "",
    }: {
      children: React.ReactNode;
      className?: string;
    }) {
      const ref = useGsapFadeUp();
      return (
        <div ref={ref} className={className}>
          {children}
        </div>
      );
    }

  use_site_settings_ts: |
    # FILE: hooks/use-site-settings.ts (49 lines)
    # ─────────────────────────────────────────────
    "use client";

    import { useState, useEffect } from "react";

    interface SiteSettings {
      logoUrl: string | null;
      facebookUrl: string;
      instagramUrl: string;
      whatsappNumber: string;
    }

    const DEFAULT: SiteSettings = {
      logoUrl: null,
      facebookUrl: "",
      instagramUrl: "",
      whatsappNumber: "",
    };

    let cachedSettings: SiteSettings | null = null;
    let fetchPromise: Promise<SiteSettings> | null = null;

    function fetchSettings(): Promise<SiteSettings> {
      if (cachedSettings) return Promise.resolve(cachedSettings);
      if (!fetchPromise) {
        fetchPromise = fetch("/api/settings")
          .then((r) => r.json())
          .then((data) => {
            cachedSettings = {
              logoUrl: data.logoUrl ?? null,
              facebookUrl: data.facebookUrl ?? "",
              instagramUrl: data.instagramUrl ?? "",
              whatsappNumber: data.whatsappNumber ?? "",
            };
            return cachedSettings;
          })
          .catch(() => DEFAULT);
      }
      return fetchPromise;
    }

    export function useSiteSettings() {
      const [settings, setSettings] = useState<SiteSettings>(cachedSettings ?? DEFAULT);
      useEffect(() => { fetchSettings().then(setSettings); }, []);
      return settings;
    }

