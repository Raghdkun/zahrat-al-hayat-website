    "use client";

    import { useTranslations, useLocale } from "next-intl";
    import { useEffect, useState } from "react";
    import { Link } from "@/i18n/navigation";

    interface Teacher {
      id: string;
      bioAr: string | null;
      bioEn: string | null;
      specialties: string[];
      hourlyRate: number;
      currency: string;
      user: {
        name: string;
        email: string;
        image: string | null;
      };
    }

    export default function Teachers() {
      const t = useTranslations("teachers");
      const locale = useLocale();
      const isRtl = locale === "ar";
      const [teachers, setTeachers] = useState<Teacher[]>([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch("/api/teachers?active=true")
          .then((r) => r.json())
          .then((data) => {
            setTeachers(data);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      }, []);

      if (loading) {
        return (
          <section className="py-16 sm:py-20 px-4 sm:px-6 lg:px-16" id="teachers">
            <div className="max-w-6xl mx-auto text-center">
              <div className="h-8 w-48 bg-gray-200 rounded mx-auto animate-pulse" />
            </div>
          </section>
        );
      }

      if (teachers.length === 0) return null;

      return (
        <section className="py-16 sm:py-20 px-4 sm:px-6 lg:px-16 bg-[#faf5fc]" id="teachers">
          <div className="max-w-6xl mx-auto">
            <div className="text-center max-w-2xl mx-auto mb-12 sm:mb-16 flex flex-col gap-3" data-anim="fade-up">
              <span className="text-[#ab2c5d] font-bold tracking-widest text-xs uppercase">
                {t("label")}
              </span>
              <h2 className="editorial-header text-3xl sm:text-4xl font-black text-[#1f1a21]">
                {t("title")}
              </h2>
              <p className="text-[#4d4351] text-base">{t("subtitle")}</p>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" data-anim="stagger-up">
              {teachers.map((teacher) => {
                if (!teacher.user) return null;
                const bio = isRtl ? teacher.bioAr : teacher.bioEn;
                return (
                  <div
                    key={teacher.id}
                    className="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-500"
                  >
                    {/* Avatar */}
                    <div className="relative h-56 bg-gradient-to-br from-[#4e0078] to-[#ab2c5d] flex items-center justify-center overflow-hidden">
                      {teacher.user.image ? (
                        <img
                          src={teacher.user.image}
                          alt={teacher.user.name}
                          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                        />
                      ) : (
                        <span className="text-6xl font-black text-white/30">
                          {teacher.user.name.charAt(0)}
                        </span>
                      )}
                    </div>

                    {/* Info */}
                    <div className="p-6 flex flex-col gap-3">
                      <h3 className="text-lg font-extrabold text-[#1f1a21]">{teacher.user.name}</h3>

                      {bio && (
                        <p className="text-sm text-[#4d4351] leading-relaxed line-clamp-3">{bio}</p>
                      )}

                      {teacher.specialties.length > 0 && (
                        <div className="flex flex-wrap gap-1.5">
                          {teacher.specialties.slice(0, 4).map((s) => (
                            <span
                              key={s}
                              className="text-xs bg-[#faf0ff] text-[#4e0078] px-2.5 py-1 rounded-full font-medium"
                            >
                              {s}
                            </span>
                          ))}
                        </div>
                      )}

                      <div className="pt-3 border-t mt-1">
                        <Link href="/book">
                          <button className="w-full signature-gradient text-white py-2.5 rounded-full text-sm font-bold hover:scale-[1.02] transition-transform shadow-md">
                            {t("book_with")} {teacher.user.name.split(" ")[0]}
                          </button>
                        </Link>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      );
    }

