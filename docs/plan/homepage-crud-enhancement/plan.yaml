         - Links to main content area with id="main-content"
         - Add id="main-content" to <main> element
         - Use i18n for link text (add 'skip_to_content' key to common namespace)
      2. Verify all GSAP animation selectors still work after component changes:
         - .hero-logo, h1, h1 span, p, .hero-buttons (hero entrance)
         - [data-anim-left], [data-anim-right] (split reveal)
         - [data-anim='stagger-scale'] (services)
         - [data-anim='stagger-up'] (gallery, teachers)
         - [data-anim='zoom-in'] (CTA)
         - [data-anim='fade-up'] (section headers)
         - [data-parallax] (decorative elements)
      3. Add skip_to_content key to both en.json and ar.json under 'common' namespace
    wave: 3
