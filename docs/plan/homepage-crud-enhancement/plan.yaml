  - id: task_crud_blog_content
    title: "Test Blog and Content CRUD operations via browser"
    description: |
      Browser-test Blog and Content management:
      Blog (full CRUD):
        1. Navigate to dashboard/blog
        2. CREATE: Add new blog post with bilingual title, excerpt, content, cover image
        3. READ: Verify post appears in list with correct data
        4. UPDATE: Edit title and toggle publish status
        5. DELETE: Delete the test post and verify removal
      Content (full CRUD):
        1. Navigate to dashboard/content
        2. CREATE: Add new content block to a section
        3. READ: Verify block appears with correct section/data
        4. UPDATE: Edit block text and reorder
        5. DELETE: Delete test block and verify removal
    wave: 4
    agent: gem-browser-tester
    priority: medium
    status: pending
    dependencies:
      - task_page_level
    context_files:
      - "app/[locale]/dashboard/blog/page.tsx": "Blog dashboard page"
      - "app/[locale]/dashboard/content/page.tsx": "Content dashboard page"
      - "app/api/blog/route.ts": "Blog API route"
      - "app/api/content/route.ts": "Content API route"
    estimated_effort: medium
    estimated_files: 0
    estimated_lines: 0
    focus_area: null
    validation_matrix:
      - scenario: "Blog Create"
        steps:
          - "Navigate to /en/dashboard/blog"
          - "Click add/create button"
          - "Fill in English title, Arabic title, content"
          - "Click save/publish"
        expected_result: "New blog post appears in list with correct titles"
      - scenario: "Blog Update"
        steps:
          - "Click edit on existing blog post"
          - "Change the English title"
          - "Toggle publish status"
          - "Click save"
        expected_result: "Post title updated, publish status toggled"
      - scenario: "Blog Delete"
        steps:
          - "Click delete on a blog post"
          - "Confirm deletion"
        expected_result: "Post removed from list"
      - scenario: "Content Create"
        steps:
          - "Navigate to /en/dashboard/content"
          - "Click add button on a section tab"
          - "Fill in key, English value, Arabic value"
          - "Click save"
        expected_result: "New content block appears in correct section"
      - scenario: "Content Delete"
        steps:
          - "Click delete on a content block"
          - "Confirm deletion"
        expected_result: "Content block removed"

