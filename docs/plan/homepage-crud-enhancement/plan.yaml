plan_id: homepage-crud-enhancement
objective: |
  Enhance all landing page component UIs with modern design patterns (shadcn/ui components, brand theming via CSS variables,
  proper i18n, accessibility fixes) and verify dashboard CRUD operations work correctly.
  User priority: "we need more attention to the website landing page."
created_at: "2026-03-31"
created_by: gem-planner
status: pending_approval
research_confidence: high

tldr: |
  13-task plan across 4 waves to modernize the landing page and verify dashboard CRUD.
  Wave 1-2: Enhance all 8 public components — replace hardcoded hex colors with Tailwind theme classes (text-primary, bg-brand-primary, etc.),
  adopt shadcn Button/Card/Badge/Avatar/Sheet, fix i18n bugs (CTASection hardcoded Arabic, Footer locale conditionals),
  add accessibility (lightbox ESC/focus-trap, aria-labels, skip-to-content). Wave 3: Footer + page-level adjustments.
  Wave 4: Browser-test all dashboard CRUD operations. Each component task touches exactly 1 file (≤3 with i18n message files).

open_questions:
  - "Should CTASection get its own i18n namespace ('cta') or continue reusing 'hero'?"
  - "Are the Google CDN images in About.tsx and Founder.tsx placeholders to be replaced, or permanent?"
  - "Should the unused hooks/use-gsap.tsx be deleted as dead code?"

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: "Replacing hardcoded hex colors with Tailwind theme classes breaks visual appearance"
      likelihood: medium
      impact: medium
      mitigation: "Each component has a visual verification step. Brand colors are already mapped in globals.css @theme block — just need to use the correct class names (bg-brand-primary, text-brand-secondary, etc.)."
    - scenario: "shadcn component adoption changes GSAP animation selectors and breaks scroll animations"
      likelihood: medium
      impact: high
      mitigation: "GSAP animations target data-attributes (data-anim-left, data-anim='stagger-scale') and CSS classes (.hero-logo, .hero-buttons), NOT element types. Preserve all data-attributes and class names when refactoring to shadcn."
    - scenario: "Adding new i18n keys causes runtime crash if keys missing in one locale file"
      likelihood: low
      impact: high
      mitigation: "Every task that adds i18n keys MUST update both en.json and ar.json in the same commit. Acceptance criteria explicitly require both files."
    - scenario: "RTL layout breaks when replacing custom components with shadcn"
      likelihood: low
      impact: medium
      mitigation: "shadcn components are RTL-compatible. Test with both ar and en locales in acceptance criteria."
  assumptions:
    - "GSAP animations in page.tsx remain centralized and driven by data-attributes — components only add attributes"
    - "shadcn/ui components (Button, Card, Badge, Avatar, Sheet) are already installed in components/ui/"
    - "Tailwind v4 @theme tokens (brand-primary, brand-secondary, surface-*, on-surface-*) resolve correctly to brand colors"
    - "All landing page components are client components or can use useTranslations hook"
    - "Dashboard CRUD testing requires a running dev server with seeded database"

implementation_specification:
  code_structure: |
    Each landing page component (components/public/*.tsx) is enhanced in-place. No new files created except
    i18n key additions in messages/en.json and messages/ar.json. shadcn components are imported from @/components/ui/*.
    Pattern: replace hardcoded hex → Tailwind theme class, replace custom HTML → shadcn component, add missing i18n keys.
  affected_areas:
    - "components/public/ (all 9 component files)"
    - "messages/en.json and messages/ar.json (i18n key additions for CTA and Footer)"
    - "app/[locale]/page.tsx (skip-to-content link, potential animation selector adjustments)"
  component_details:
    - component: "Hero.tsx"
      responsibility: "Hero banner with gradient, headlines, CTA buttons"
      interfaces:
        - "Uses useTranslations('hero'), useSiteSettings()"
        - "GSAP targets: .hero-logo, h1, h1 span, p, .hero-buttons"
        - "Exports default Hero component"
    - component: "About.tsx"
      responsibility: "About section with image + feature cards grid"
      interfaces:
        - "Uses useTranslations('about')"
        - "GSAP targets: data-anim-left, data-anim-right"
    - component: "Services.tsx"
      responsibility: "Services grid with 4 service cards"
      interfaces:
        - "Uses useTranslations('services')"
        - "GSAP targets: data-anim='fade-up', data-anim='stagger-scale'"
    - component: "Navbar.tsx"
      responsibility: "Fixed navigation bar with desktop/mobile menu"
      interfaces:
        - "Uses useTranslations('nav'), useSiteSettings(), useLocale()"
        - "Mobile menu toggle state"
    - component: "Teachers.tsx"
      responsibility: "Dynamic teacher cards fetched from API"
      interfaces:
        - "Fetches /api/teachers?active=true"
        - "GSAP targets: data-anim='fade-up', data-anim='stagger-up'"
    - component: "Gallery.tsx"
      responsibility: "Dynamic gallery grid with lightbox"
      interfaces:
        - "Fetches /api/gallery"
        - "GSAP targets: data-anim='fade-up', data-anim='stagger-up'"
        - "Lightbox overlay with image/video display"
    - component: "Founder.tsx"
      responsibility: "Founder bio section with credentials"
      interfaces:
        - "Uses useTranslations('founder')"
        - "GSAP targets: data-anim-right, data-anim-left, data-parallax"
    - component: "CTASection.tsx"
      responsibility: "Call-to-action banner"
      interfaces:
        - "Uses useTranslations — needs new 'cta' namespace or added keys to 'hero'"
        - "GSAP targets: data-anim='zoom-in'"
    - component: "Footer.tsx"
      responsibility: "Site footer with brand info, links, contact, social"
      interfaces:
        - "Uses useTranslations('footer'), useTranslations('nav'), useSiteSettings()"
  dependencies:
    - component: "All public components"
      relationship: "Import shadcn components from @/components/ui/ (Button, Card, Badge, Avatar, Sheet)"
    - component: "CTASection.tsx, Footer.tsx"
      relationship: "Depend on i18n key additions in messages/*.json"
  integration_points:
    - "GSAP data-attributes must be preserved on DOM elements for animation system in page.tsx"
    - "shadcn Button replaces custom <a>/<button> elements but must keep same class names for GSAP targeting"
    - "New i18n keys must exist in both en.json and ar.json before component changes go live"

contracts:
  - from_task: "task_cta"
    to_task: "task_page_level"
    interface: "CTA i18n keys added to messages files; if new namespace created, page.tsx may need provider adjustment"
    format: "JSON keys in messages/en.json and messages/ar.json under 'cta' or 'hero' namespace"
  - from_task: "task_footer"
    to_task: "task_page_level"
    interface: "Footer i18n keys added; skip-to-content link coordination"
    format: "JSON keys in messages/en.json and messages/ar.json under 'footer' namespace"

