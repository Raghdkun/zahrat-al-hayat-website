    title: "Enhance Footer with i18n fixes and brand theming"
    description: |
      Modernize Footer.tsx:
      1. Replace hardcoded locale-conditional text with i18n keys:
         - Brand description (locale === 'ar' ? '...' : '...') → t('brand_description')
         - Section headers ('روابط سريعة' / 'Quick Links') → t('quick_links')
         - Location text → t('location')
         - Any other hardcoded strings → i18n keys
      2. Add new keys to BOTH messages/en.json and messages/ar.json under 'footer' namespace
      3. Replace hardcoded hex colors with Tailwind theme classes
      4. Add aria-labels to social media icon links (Facebook, Instagram, WhatsApp)
      5. Use shadcn <Button> variant="ghost" for social icon buttons if appropriate
      6. Improve layout and spacing for better visual hierarchy
    wave: 3
    agent: gem-implementer
    priority: high
    status: pending
    dependencies:
      - task_cta
    context_files:
      - "components/public/Footer.tsx": "Current footer component (120 lines)"
      - "messages/en.json": "English translations — needs new footer keys"
      - "messages/ar.json": "Arabic translations — needs new footer keys"
      - "components/ui/button.tsx": "shadcn Button"
    estimated_effort: medium
    estimated_files: 3
    estimated_lines: 130
    focus_area: "components/public/Footer.tsx"
    tech_stack:
      - "shadcn/ui Button (ghost variant for icon links)"
      - "next-intl useTranslations"
      - "Tailwind CSS v4 theme classes"
    test_coverage: null
    verification:
      - "No locale-conditional hardcoded text (locale === 'ar' ? ... : ...)"
      - "All text rendered via t() translation calls"
      - "Social icon links have aria-label attributes"
      - "messages/en.json and ar.json have all needed footer keys"
    acceptance_criteria:
      - "Brand description uses i18n key, not locale conditional"
      - "Section headers use i18n keys"
      - "Location text uses i18n key"
      - "Social links have aria-label (e.g., 'Facebook', 'Instagram', 'WhatsApp')"
      - "All colors use Tailwind theme classes"
      - "Both en.json and ar.json updated with new footer keys"
      - "Footer renders correctly in both RTL and LTR"
    failure_modes:
      - scenario: "Adding too many keys to footer namespace conflicts with existing keys"
        likelihood: low
        impact: low
        mitigation: "Check existing footer keys (rights, privacy, terms, contact) before adding new ones"

  - id: task_page_level
