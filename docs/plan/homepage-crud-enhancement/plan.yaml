      - "Link is visually hidden until focused"
      - "Link navigates to #main-content"
      - "main element has id='main-content'"
      - "All GSAP animations still trigger correctly"
    acceptance_criteria:
      - "Tab key focuses skip-to-content link first"
      - "Skip link visible only on keyboard focus"
      - "Clicking skip link scrolls to main content"
      - "All 7 GSAP animation types still function after component changes"
