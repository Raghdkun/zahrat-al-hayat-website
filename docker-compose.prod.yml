services:
  postgres:
    image: postgres:16-alpine
    container_name: zahrat_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-zahrat_al_hayat}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot job: applies pending Prisma migrations (incl. the partial unique
  # index) before the app starts. Uses the builder stage, which has the Prisma
  # CLI + migrations. Exits 0 on success; the app waits for that.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: zahrat_migrate_prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zahrat_al_hayat}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zahrat_app_prod
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zahrat_al_hayat}
      NODE_ENV: production
    # App secrets (NEXTAUTH_SECRET, NEXTAUTH_URL, RESEND_API_KEY,
    # NEXT_PUBLIC_APP_URL, optional STRIPE_*). Copy .env.production.example -> .env.
    env_file:
      - .env
    volumes:
      # Persist user uploads across redeploys (served from public/uploads).
      - uploads_prod:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ar > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: zahrat_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # ACME http-01 webroot (optional, for certbot)
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data_prod:
  uploads_prod:
